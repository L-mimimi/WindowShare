# 发布：推 v* 标签触发，构建安装包 + 便携版并发布 GitHub Release
# 版本号唯一出处是 Directory.Build.props 的 <Version>（与标签保持一致，由发布者自行保证）
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # runner 预装 Inno Setup 6，build.ps1 会自动定位；
      # -SkipTests 跳过冒烟（无采集/音频设备），单元测试在下一步单独跑
      - name: Build + package
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1 -Package -Portable -SkipTests

      - name: Unit tests
        run: dotnet test -c Release --no-build -m:1

      - name: Generate SHA256
        shell: pwsh
        run: |
          $files = @(Get-Item installer/output/WindowShare-Setup-*.exe) +
                   @(Get-Item dist/portable/WindowShare-Portable-*.zip)
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/output/WindowShare-Setup-*.exe
            dist/portable/WindowShare-Portable-*.zip
            SHA256SUMS.txt
